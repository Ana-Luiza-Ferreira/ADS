
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cadastre-se</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Faça parte da nossa ONG</h2>
            <p>Preencha o formulário para se tornar um doador ou voluntário.</p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Informações pessoais</legend>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                    <br><br>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                    <br><br>

                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                    <br><br>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf"
                           placeholder="000.000.000-00"
                           pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                           title="Digite o CPF no formato 000.000.000-00"
                           required>
                    <br><br>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone"
                           placeholder="(00) 00000-0000"
                           pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                           title="Digite no formato (00) 00000-0000"
                           required>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Endereço</legend>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep"
                           placeholder="00000-000"
                           pattern="[0-9]{5}-[0-9]{3}"
                           title="Digite o CEP no formato 00000-000"
                           required>
                    <br><br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <br><br>

                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado"
                           maxlength="2" placeholder="PR" required>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Forma de participação</legend>

                    <input type="radio" id="doador" name="participacao"
                           value="doador" required>
                    <label for="doador">Quero ser doador</label>
                    <br>

                    <input type="radio" id="voluntario" name="participacao"
                           value="voluntario">
                    <label for="voluntario">Quero ser voluntário</label>
                </fieldset>

                <br>

                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar formulário</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Mãos Solidárias</p>
    </footer>

</body>
</html>
